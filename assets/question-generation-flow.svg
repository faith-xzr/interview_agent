<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="420" viewBox="0 0 1120 420" role="img" aria-labelledby="title desc">
  <title id="title">Question Generation Flow</title>
  <desc id="desc">JD profile, candidate profile, and match evidence generate at least ten interview questions with focus and scoring criteria.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#6a4a8f" />
    </marker>
    <style>
      .bg { fill: #fbf8ff; }
      .box { fill: #ffffff; stroke: #cab9dc; stroke-width: 2; rx: 8; }
      .accent { fill: #f1e9fb; stroke: #9272b8; }
      .title { font: 700 24px Arial, sans-serif; fill: #172033; }
      .label { font: 700 17px Arial, sans-serif; fill: #172033; }
      .note { font: 14px Arial, sans-serif; fill: #4b5870; }
      .arrow { stroke: #6a4a8f; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="bg" width="1120" height="420" rx="16" />
  <text class="title" x="40" y="48">Interview Question Generation</text>
  <text class="note" x="40" y="76">Questions are grounded in JD requirements, candidate facts, and match evidence.</text>
  <g transform="translate(70 150)">
    <rect class="box" width="190" height="110" />
    <text class="label" x="24" y="38">JD Profile</text>
    <text class="note" x="24" y="66">role / skills</text>
    <text class="note" x="24" y="88">responsibilities</text>
  </g>
  <path class="arrow" d="M270 205 H355" />
  <g transform="translate(365 150)">
    <rect class="box" width="210" height="110" />
    <text class="label" x="24" y="38">Candidate Profile</text>
    <text class="note" x="24" y="66">projects / skills</text>
    <text class="note" x="24" y="88">highlights</text>
  </g>
  <path class="arrow" d="M585 205 H670" />
  <g transform="translate(680 150)">
    <rect class="box accent" width="190" height="110" />
    <text class="label" x="24" y="38">Match Report</text>
    <text class="note" x="24" y="66">evidence snippets</text>
    <text class="note" x="24" y="88">gap reasons</text>
  </g>
  <path class="arrow" d="M880 205 H965" />
  <g transform="translate(975 150)">
    <rect class="box" width="110" height="110" />
    <text class="label" x="22" y="38">10+</text>
    <text class="note" x="22" y="66">questions</text>
    <text class="note" x="22" y="88">criteria</text>
  </g>
</svg>
