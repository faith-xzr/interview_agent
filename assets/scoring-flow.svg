<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1320" viewBox="0 0 1800 1320" role="img" aria-labelledby="title desc">
  <title id="title">智能匹配打分与证据回溯流程</title>
  <desc id="desc">按六个维度逐项评分，绑定 evidence，输出可解释 MatchReport。</desc>
  <defs>
    <marker id="arrow-head" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,10 L11,5 z" fill="#3A806C"/>
    </marker>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#1F2A36" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg { fill: #FFFFFF; }
      .title { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif; font-size: 42px; font-weight: 800; fill: #1F2F3A; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif; font-size: 19px; fill: #5B6873; }
      .section { fill: #EEF3F5; stroke: #AAB8C0; stroke-width: 2.2; filter: url(#soft-shadow); }
      .section-warm { fill: #FFF7E8; stroke: #D8AE63; stroke-width: 2.2; filter: url(#soft-shadow); }
      .section-green { fill: #ECF6F1; stroke: #87B9A6; stroke-width: 2.2; filter: url(#soft-shadow); }
      .section-red { fill: #FFF0EF; stroke: #D58A82; stroke-width: 2.2; filter: url(#soft-shadow); }
      .card { fill: #FFFFFF; stroke: #B7C6CF; stroke-width: 2; filter: url(#soft-shadow); }
      .card-blue { fill: #F8FBFD; stroke: #78A4C2; stroke-width: 2.2; filter: url(#soft-shadow); }
      .card-green { fill: #F6FCF8; stroke: #7DB397; stroke-width: 2.2; filter: url(#soft-shadow); }
      .card-warm { fill: #FFFCF4; stroke: #D3A44F; stroke-width: 2.2; filter: url(#soft-shadow); }
      .card-red { fill: #FFF8F7; stroke: #D88C83; stroke-width: 2.2; filter: url(#soft-shadow); }
      .section-title { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif; font-size: 22px; font-weight: 800; fill: #20303A; }
      .box-title { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif; font-size: 21px; font-weight: 800; fill: #20303A; }
      .label { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #20303A; }
      .note { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif; font-size: 16px; fill: #46535E; }
      .tiny { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif; font-size: 13px; fill: #596873; }
      .tiny-strong { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif; font-size: 13px; font-weight: 800; fill: #2D3D48; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif; font-size: 14px; font-weight: 800; fill: #26424D; }
      .footer { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif; font-size: 13px; fill: #6E7A83; }
      .num { fill: #3A806C; stroke: #FFFFFF; stroke-width: 2; }
      .num-text { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif; font-size: 16px; font-weight: 800; fill: #FFFFFF; }
      .arrow { stroke: #3A806C; stroke-width: 4; fill: none; marker-end: url(#arrow-head); stroke-linecap: round; stroke-linejoin: round; }
      .dashed { stroke-dasharray: 10 8; opacity: 0.85; }
      .thin { stroke: #D1DCE3; stroke-width: 1.2; }
      .lane { fill: #FFFFFF; stroke: #C8D5DC; stroke-width: 1.6; }
      .legend-line { stroke: #3A806C; stroke-width: 4; marker-end: url(#arrow-head); }
    </style>
  </defs>
  <rect class="bg" width="1800" height="1320"/>
  <text class="title" x="80" y="68">智能匹配打分与证据回溯流程</text>
  <text class="subtitle" x="80" y="106">按六个维度逐项评分，绑定 evidence，输出可解释 MatchReport。</text>
  <g><rect class="section" x="80" y="140" width="1660" height="128" rx="14" /><text class="section-title" x="108" y="178">输入层：抽取结果 + 原文证据索引</text><text class="tiny" x="108" y="206"><tspan x="108" dy="0">评分不只看字段命中，还会把结构化 facts、向量召回片段和风险点合并判断。</tspan></text></g>
<g><rect class="card-blue" x="120" y="186" width="290" height="70" rx="14" /><text class="box-title" x="144" y="225">JDProfile</text><text class="note" x="144" y="260"><tspan x="144" dy="0">required_skills / responsibilities</tspan></text></g>
<g><rect class="card-blue" x="450" y="186" width="330" height="70" rx="14" /><text class="box-title" x="474" y="225">CandidateProfile</text><text class="note" x="474" y="260"><tspan x="474" dy="0">skills / projects / education / risks</tspan></text></g>
<g><rect class="card-blue" x="820" y="186" width="340" height="70" rx="14" /><text class="box-title" x="844" y="225">extraction_facts</text><text class="note" x="844" y="260"><tspan x="844" dy="0">带 evidence 与 section 的事实索引</tspan></text></g>
<g><rect class="card-blue" x="1200" y="186" width="330" height="70" rx="14" /><text class="box-title" x="1224" y="225">VectorStore 证据片段</text><text class="note" x="1224" y="260"><tspan x="1224" dy="0">Chroma 可用；失败时 hashing 内存召回</tspan></text></g>
<g><rect class="section" x="80" y="310" width="1065" height="760" rx="14" /><text class="section-title" x="108" y="348">主流程：需求拆解、逐项匹配、分数聚合</text><text class="tiny" x="108" y="376"><tspan x="108" dy="0">每个分数贡献都能回到 RequirementMatch 与 EvidenceSnippet。</tspan></text></g>
<g><rect class="card" x="130" y="372" width="430" height="128" rx="14" /><circle class="num" cx="158" cy="404" r="18"/><text class="num-text" x="152" y="411">1</text><text class="box-title" x="188" y="411">构建事实索引</text><rect class="" x="354" y="388" width="188" height="34" rx="14" fill="#EAF4F1" stroke="#71A99A" stroke-width="1.8"/><text class="badge-text" x="368" y="411">fact index</text><text class="note" x="154" y="446"><tspan x="154" dy="0">合并 extraction_facts 与 profile_summary</tspan><tspan x="154" dy="24">按 section 排序：项目/经历证据优先</tspan><tspan x="154" dy="24">补足技能、项目、教育、证书伪事实</tspan></text></g>
<g><rect class="card-blue" x="640" y="372" width="450" height="146" rx="14" /><circle class="num" cx="668" cy="404" r="18"/><text class="num-text" x="662" y="411">2</text><text class="box-title" x="698" y="411">拆解岗位要求</text><rect class="" x="804" y="388" width="268" height="34" rx="14" fill="#EAF4F1" stroke="#71A99A" stroke-width="1.8"/><text class="badge-text" x="818" y="411">RequirementSpec</text><text class="note" x="664" y="446"><tspan x="664" dy="0">核心技能与工具 30</tspan><tspan x="664" dy="24">岗位职责匹配 20；年限与级别 15</tspan><tspan x="664" dy="24">项目证据深度 20；行业 8；教育/硬条件 7</tspan></text></g>
<g><rect class="card-blue" x="130" y="590" width="430" height="150" rx="14" /><circle class="num" cx="158" cy="622" r="18"/><text class="num-text" x="152" y="629">3</text><text class="box-title" x="188" y="629">逐项匹配与证据绑定</text><rect class="" x="258" y="606" width="284" height="34" rx="14" fill="#EAF4F1" stroke="#71A99A" stroke-width="1.8"/><text class="badge-text" x="272" y="629">RequirementMatch</text><text class="note" x="154" y="664"><tspan x="154" dy="0">强匹配 / 直接匹配 / 相关 / 弱 / 未匹配</tspan><tspan x="154" dy="24">根据 confidence 与 STATUS_FACTORS 计算贡献</tspan><tspan x="154" dy="24">最多保留 2 条最相关 evidence</tspan></text></g>
<g><rect class="card-green" x="640" y="590" width="450" height="150" rx="14" /><circle class="num" cx="668" cy="622" r="18"/><text class="num-text" x="662" y="629">4</text><text class="box-title" x="698" y="629">维度聚合</text><rect class="" x="900" y="606" width="172" height="34" rx="14" fill="#EAF4F1" stroke="#71A99A" stroke-width="1.8"/><text class="badge-text" x="914" y="629">dimension</text><text class="note" x="664" y="664"><tspan x="664" dy="0">各维度 score 不超过 max_score</tspan><tspan x="664" dy="24">生成 dimension_scores 与解释摘要</tspan><tspan x="664" dy="24">形成 skill / experience / project 等 breakdown</tspan></text></g>
<g><rect class="card-red" x="130" y="812" width="430" height="128" rx="14" /><circle class="num" cx="158" cy="844" r="18"/><text class="num-text" x="152" y="851">5</text><text class="box-title" x="188" y="851">风险扣分与封顶</text><rect class="" x="370" y="828" width="172" height="34" rx="14" fill="#EAF4F1" stroke="#71A99A" stroke-width="1.8"/><text class="badge-text" x="384" y="851">risk caps</text><text class="note" x="154" y="886"><tspan x="154" dy="0">核心技能缺口过半：扣分并封顶 69</tspan><tspan x="154" dy="24">年限不足、无项目证据、risk_points 触发扣分</tspan><tspan x="154" dy="24">硬条件弱匹配同样可封顶</tspan></text></g>
<g><rect class="card-green" x="640" y="812" width="450" height="128" rx="14" /><circle class="num" cx="668" cy="844" r="18"/><text class="num-text" x="662" y="851">6</text><text class="box-title" x="698" y="851">生成 MatchReport</text><rect class="" x="952" y="828" width="108" height="34" rx="14" fill="#EAF4F1" stroke="#71A99A" stroke-width="1.8"/><text class="badge-text" x="966" y="851">0-100</text><text class="note" x="664" y="886"><tspan x="664" dy="0">total_score 被 clamp 到 0-100</tspan><tspan x="664" dy="24">match_reasons 与 gap_reasons 同时生成</tspan><tspan x="664" dy="24">后续试题/追问直接消费该报告</tspan></text></g>
<path class="arrow" d="M560 436 L640 436"/>
<path class="arrow" d="M865 518 V590"/>
<path class="arrow" d="M560 665 L640 665"/>
<path class="arrow" d="M865 740 V812"/>
<path class="arrow" d="M560 876 L640 876"/>
<path class="arrow" d="M345 500 V590"/>
<path class="arrow" d="M345 740 V812"/>
<g><rect class="section-warm" x="1180" y="310" width="560" height="760" rx="14" /><text class="section-title" x="1208" y="348">右侧资源：召回、状态因子与解释模板</text><text class="tiny" x="1208" y="376"><tspan x="1208" dy="0">这些规则让“为什么是这个分数”可复盘。</tspan></text></g>
<g><rect class="card-warm" x="1230" y="372" width="465" height="128" rx="14" /><text class="box-title" x="1254" y="411">证据召回</text><text class="note" x="1254" y="446"><tspan x="1254" dy="0">add_document(run_id, owner_id, source, text)</tspan><tspan x="1254" dy="24">query_text = JD 技能 + 职责 + 岗位名</tspan><tspan x="1254" dy="24">候选人 top 5 片段进入 evidence_snippets</tspan></text></g>
<g><rect class="" x="1258" y="534" width="270" height="190" rx="14" fill="#FFFFFF" stroke="#CAD5DC" stroke-width="1.6"/><text class="tiny-strong" x="1274" y="568">强匹配</text><text class="tiny" x="1374" y="568">1.00</text><line class="thin" x1="1270" y1="579" x2="1516" y2="579"/><text class="tiny-strong" x="1274" y="602">直接匹配</text><text class="tiny" x="1374" y="602">0.85</text><line class="thin" x1="1270" y1="613" x2="1516" y2="613"/><text class="tiny-strong" x="1274" y="636">相关匹配</text><text class="tiny" x="1374" y="636">0.60</text><line class="thin" x1="1270" y1="647" x2="1516" y2="647"/><text class="tiny-strong" x="1274" y="670">弱匹配</text><text class="tiny" x="1374" y="670">0.35</text><line class="thin" x1="1270" y1="681" x2="1516" y2="681"/><text class="tiny-strong" x="1274" y="704">未匹配</text><text class="tiny" x="1374" y="704">0.00</text></g>
<g><rect class="card" x="1230" y="760" width="465" height="132" rx="14" /><text class="box-title" x="1254" y="799">解释口径</text><text class="note" x="1254" y="834"><tspan x="1254" dy="0">项目/经历证据优先于普通字段</tspan><tspan x="1254" dy="24">同一技术簇可形成相关匹配</tspan><tspan x="1254" dy="24">缺口项进入 gap_reasons 供追问使用</tspan></text></g>
<g><rect class="card-green" x="1230" y="922" width="465" height="70" rx="14" /><text class="box-title" x="1254" y="961">无召回兜底</text><text class="note" x="1254" y="996"><tspan x="1254" dy="0">未检索到片段时，使用结构化简历摘要</tspan></text></g>
<path class="arrow dashed" d="M1230 980 L1090 876"/>
<g><rect class="section-green" x="80" y="1110" width="1660" height="140" rx="14" /><text class="section-title" x="108" y="1148">输出层：前端匹配页与后续生成模块的共享输入</text><text class="tiny" x="108" y="1176"><tspan x="108" dy="0">评分结果既是排序依据，也是试题生成和追问模拟的证据上下文。</tspan></text></g>
<g><rect class="card-green" x="125" y="1162" width="270" height="74" rx="14" /><text class="box-title" x="149" y="1201">total_score</text><text class="note" x="149" y="1236"><tspan x="149" dy="0">0-100 排名展示</tspan></text></g>
<g><rect class="card-green" x="430" y="1162" width="330" height="74" rx="14" /><text class="box-title" x="454" y="1201">requirement_matches</text><text class="note" x="454" y="1236"><tspan x="454" dy="0">每项要求的状态、贡献、证据</tspan></text></g>
<g><rect class="card-green" x="795" y="1162" width="330" height="74" rx="14" /><text class="box-title" x="819" y="1201">match / gap reasons</text><text class="note" x="819" y="1236"><tspan x="819" dy="0">关键亮点与待确认缺口</tspan></text></g>
<g><rect class="card-green" x="1160" y="1162" width="330" height="74" rx="14" /><text class="box-title" x="1184" y="1201">evidence_snippets</text><text class="note" x="1184" y="1236"><tspan x="1184" dy="0">召回片段或摘要兜底</tspan></text></g>
<text class="footer" x="80" y="1280">代码路径：backend/app/scoring/scorer.py + vector_store.py + schemas.py</text><text class="footer" x="1480" y="1280">静态说明图 / 不参与运行时加载</text>
</svg>