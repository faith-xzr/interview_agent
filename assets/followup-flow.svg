<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="420" viewBox="0 0 1120 420" role="img" aria-labelledby="title desc">
  <title id="title">Follow-Up Flow</title>
  <desc id="desc">Ambiguous resume points and match gaps are reviewed to generate three to five follow-up questions.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8a5c31" />
    </marker>
    <style>
      .bg { fill: #fffaf3; }
      .box { fill: #ffffff; stroke: #dcc6ad; stroke-width: 2; rx: 8; }
      .accent { fill: #fff0dc; stroke: #be8752; }
      .title { font: 700 24px Arial, sans-serif; fill: #172033; }
      .label { font: 700 17px Arial, sans-serif; fill: #172033; }
      .note { font: 14px Arial, sans-serif; fill: #4b5870; }
      .arrow { stroke: #8a5c31; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="bg" width="1120" height="420" rx="16" />
  <text class="title" x="40" y="48">Follow-Up Simulation</text>
  <text class="note" x="40" y="76">Follow-ups target uncertainty rather than repeating the main interview questions.</text>
  <g transform="translate(65 150)">
    <rect class="box" width="205" height="110" />
    <text class="label" x="24" y="38">Ambiguities</text>
    <text class="note" x="24" y="66">missing dates</text>
    <text class="note" x="24" y="88">unclear ownership</text>
  </g>
  <path class="arrow" d="M280 205 H365" />
  <g transform="translate(375 150)">
    <rect class="box" width="205" height="110" />
    <text class="label" x="24" y="38">Gap Reasons</text>
    <text class="note" x="24" y="66">weak matches</text>
    <text class="note" x="24" y="88">missing evidence</text>
  </g>
  <path class="arrow" d="M590 205 H675" />
  <g transform="translate(685 150)">
    <rect class="box accent" width="175" height="110" />
    <text class="label" x="24" y="38">Risk Review</text>
    <text class="note" x="24" y="66">prioritize</text>
    <text class="note" x="24" y="88">clarify</text>
  </g>
  <path class="arrow" d="M870 205 H955" />
  <g transform="translate(965 150)">
    <rect class="box" width="115" height="110" />
    <text class="label" x="22" y="38">3-5</text>
    <text class="note" x="22" y="66">follow-up</text>
    <text class="note" x="22" y="88">questions</text>
  </g>
</svg>
