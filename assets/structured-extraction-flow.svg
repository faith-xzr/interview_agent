<svg width="1800" height="1320" viewBox="0 0 1800 1320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow-blue" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2L16 9L2 16Z" fill="#3D7EA6"/>
    </marker>
    <marker id="arrow-orange" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2L16 9L2 16Z" fill="#D18A2E"/>
    </marker>
    <style>
      .bg { fill: #F7FAFC; }
      .title { font: 700 34px "Inter", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1D2B36; }
      .subtitle { font: 400 18px "Inter", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #596A75; }
      .lane-title { font: 700 23px "Inter", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1E3442; }
      .card-title { font: 700 24px "Inter", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1E3442; }
      .body { font: 400 18px "Inter", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #3E4F59; }
      .small { font: 400 16px "Inter", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #60727D; }
      .tag { font: 700 15px "Inter", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #204C59; }
      .num { font: 700 20px "Inter", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #FFFFFF; }
      .note { font: 700 17px "Inter", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #A15F10; }
      .solid-blue { stroke: #3D7EA6; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-blue); }
      .solid-orange { stroke: #D18A2E; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-orange); }
      .dash-orange { stroke: #D18A2E; stroke-width: 4; stroke-dasharray: 12 12; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-orange); }
      .dash-blue { stroke: #3D7EA6; stroke-width: 4; stroke-dasharray: 12 12; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-blue); }
    </style>
  </defs>

  <rect class="bg" width="1800" height="1320"/>

  <text x="90" y="62" class="title">结构化抽取流程：LLM 优先，规则兜底，证据校验后输出</text>
  <text x="90" y="96" class="subtitle">当前实现先尝试 JD 与简历的 LLM 结构化抽取；LLM 不可用、失败或无可用事实时，回退到本地规则结果。</text>

  <!-- Inputs -->
  <rect x="90" y="130" width="720" height="126" rx="18" fill="#FFFFFF" stroke="#9BB7C6" stroke-width="3"/>
  <text x="128" y="176" class="card-title">JD PDF / DOCX / TXT</text>
  <text x="128" y="212" class="body">PDF 优先读取文字层；图片型 PDF 可 OCR</text>
  <text x="128" y="238" class="small">上传文件或粘贴 JD 文本，统一进入同一解析入口</text>

  <rect x="990" y="130" width="720" height="126" rx="18" fill="#FFFFFF" stroke="#9BB7C6" stroke-width="3"/>
  <text x="1028" y="176" class="card-title">简历 PDF / DOCX / TXT</text>
  <text x="1028" y="212" class="body">支持多份简历文件，也支持粘贴多段文本</text>
  <text x="1028" y="238" class="small">每份简历保留 source_name，后续按候选人独立评分</text>

  <path d="M450 256V298" class="solid-blue"/>
  <path d="M1350 256V298" class="solid-blue"/>

  <!-- Parser -->
  <rect x="360" y="300" width="1080" height="156" rx="20" fill="#EEF7FB" stroke="#74A8C4" stroke-width="3"/>
  <circle cx="416" cy="350" r="24" fill="#3D7EA6"/>
  <text x="416" y="357" text-anchor="middle" class="num">1</text>
  <text x="458" y="346" class="card-title">文档解析与文本归一化</text>
  <rect x="1192" y="322" width="190" height="42" rx="21" fill="#E7F5EF" stroke="#59AA8B" stroke-width="3"/>
  <text x="1287" y="349" text-anchor="middle" class="tag">document_parser</text>
  <text x="458" y="382" class="body">PDF: pypdf 读取文字层，必要时走 macOS OCR</text>
  <text x="458" y="410" class="body">DOCX: python-docx 读取段落；TXT: utf-8 / gb18030 / latin-1 解码</text>
  <text x="458" y="438" class="small">输出归一化纯文本，供 LLM、规则抽取、向量证据检索复用</text>

  <path d="M900 456V502" class="solid-blue"/>

  <!-- Lanes -->
  <rect x="80" y="504" width="790" height="558" rx="22" fill="#F2F8FC" stroke="#AAC5D4" stroke-width="3"/>
  <text x="118" y="550" class="lane-title">JD 抽取优先路径</text>
  <text x="118" y="580" class="small">目标：JDProfile + 原文证据 facts</text>

  <rect x="930" y="504" width="790" height="558" rx="22" fill="#F4FBF6" stroke="#A8CDB7" stroke-width="3"/>
  <text x="968" y="550" class="lane-title">简历抽取优先路径</text>
  <text x="968" y="580" class="small">目标：CandidateProfile + 分区 facts</text>

  <path d="M900 502H475V612" class="solid-blue"/>
  <path d="M900 502H1325V612" class="solid-blue"/>

  <!-- JD lane cards -->
  <rect x="116" y="612" width="718" height="150" rx="18" fill="#FFFFFF" stroke="#3D7EA6" stroke-width="3"/>
  <circle cx="164" cy="655" r="23" fill="#3D7EA6"/>
  <text x="164" y="662" text-anchor="middle" class="num">2A</text>
  <text x="204" y="650" class="card-title">LLM 首轮抽取 JD</text>
  <rect x="598" y="628" width="194" height="38" rx="19" fill="#E7F5EF" stroke="#59AA8B" stroke-width="3"/>
  <text x="695" y="652" text-anchor="middle" class="tag">llm_end_to_end</text>
  <text x="204" y="686" class="body">读取 jd_requirements.md 提示词，端到端抽 key_points</text>
  <text x="204" y="714" class="body">映射为 job_title、required_skills、responsibilities、years_required</text>
  <text x="204" y="742" class="small">每条事实必须带原文 evidence，并按 importance 转 confidence</text>

  <rect x="116" y="812" width="718" height="150" rx="18" fill="#FFF8EF" stroke="#D18A2E" stroke-width="3"/>
  <circle cx="164" cy="855" r="23" fill="#D18A2E"/>
  <text x="164" y="862" text-anchor="middle" class="num">3A</text>
  <text x="204" y="850" class="card-title">JD 规则兜底 / 补全</text>
  <rect x="622" y="828" width="170" height="38" rx="19" fill="#FFF3DA" stroke="#D18A2E" stroke-width="3"/>
  <text x="707" y="852" text-anchor="middle" class="tag">rules_fallback</text>
  <text x="204" y="886" class="body">LLM 不可用、调用失败或 facts 为空时启用</text>
  <text x="204" y="914" class="body">fallback_ai.extract_jd_profile + jd_extractor 生成本地规则事实</text>
  <text x="204" y="942" class="small">保留 warning，避免把兜底结果误认为 LLM 结果</text>

  <path d="M475 762V800" class="dash-orange"/>
  <path d="M834 687H900V1070" class="solid-blue"/>
  <path d="M834 887H900V1070" class="dash-orange"/>

  <!-- Resume lane cards -->
  <rect x="966" y="612" width="718" height="122" rx="18" fill="#FFFFFF" stroke="#A8CDB7" stroke-width="3"/>
  <circle cx="1014" cy="652" r="23" fill="#59AA8B"/>
  <text x="1014" y="659" text-anchor="middle" class="num">2B</text>
  <text x="1054" y="648" class="card-title">本地轻扫与 PII 脱敏</text>
  <rect x="1434" y="628" width="208" height="38" rx="19" fill="#E7F5EF" stroke="#59AA8B" stroke-width="3"/>
  <text x="1538" y="652" text-anchor="middle" class="tag">mask_pii</text>
  <text x="1054" y="684" class="body">先用 section_rules 轻量识别姓名等基础信息</text>
  <text x="1054" y="712" class="small">该步骤只服务脱敏与兜底，不作为优先结构化结果</text>

  <rect x="966" y="758" width="718" height="150" rx="18" fill="#FFFFFF" stroke="#3D7EA6" stroke-width="3"/>
  <circle cx="1014" cy="800" r="23" fill="#3D7EA6"/>
  <text x="1014" y="807" text-anchor="middle" class="num">3B</text>
  <text x="1054" y="796" class="card-title">LLM 首轮抽取简历事实</text>
  <rect x="1434" y="774" width="208" height="38" rx="19" fill="#E7F5EF" stroke="#59AA8B" stroke-width="3"/>
  <text x="1538" y="798" text-anchor="middle" class="tag">llm_resume</text>
  <text x="1054" y="832" class="body">读取 resume_profile.md，只抽能力、经历、项目、风险与亮点</text>
  <text x="1054" y="860" class="body">跳过基础联系方式，要求每条事实都有简历原文 evidence</text>
  <text x="1054" y="888" class="small">输出 section、line_start、line_end、confidence 与 extractor 标签</text>

  <rect x="966" y="936" width="718" height="116" rx="18" fill="#FFF8EF" stroke="#D18A2E" stroke-width="3"/>
  <circle cx="1014" cy="976" r="23" fill="#D18A2E"/>
  <text x="1014" y="983" text-anchor="middle" class="num">4B</text>
  <text x="1054" y="972" class="card-title">PII 恢复与规则兜底</text>
  <rect x="1422" y="952" width="220" height="38" rx="19" fill="#FFF3DA" stroke="#D18A2E" stroke-width="3"/>
  <text x="1532" y="976" text-anchor="middle" class="tag">restore / fallback</text>
  <text x="1054" y="1008" class="body">LLM 成功后 restore_pii，并与本地初扫字段合并</text>
  <text x="1054" y="1034" class="small">LLM 失败时使用本地 section_rules 抽取结果</text>

  <path d="M1325 734V746" class="solid-blue"/>
  <path d="M1325 908V924" class="dash-orange"/>
  <path d="M966 833H900V1070" class="solid-blue"/>
  <path d="M966 994H900V1070" class="dash-orange"/>

  <!-- Merge and downstream -->
  <rect x="260" y="1082" width="1280" height="100" rx="20" fill="#F2FBF8" stroke="#59AA8B" stroke-width="3"/>
  <circle cx="318" cy="1132" r="24" fill="#59AA8B"/>
  <text x="318" y="1139" text-anchor="middle" class="num">5</text>
  <text x="360" y="1120" class="card-title">证据过滤与事实合并</text>
  <rect x="1268" y="1102" width="190" height="38" rx="19" fill="#E7F5EF" stroke="#59AA8B" stroke-width="3"/>
  <text x="1363" y="1126" text-anchor="middle" class="tag">validated</text>
  <text x="360" y="1150" class="body">丢弃无原文 evidence 的事实；按 fact_type、value、section、line 去重</text>
  <text x="360" y="1172" class="small">保留 extractor 来源，便于解释 LLM 与规则结果差异</text>

  <path d="M900 1182V1202" class="solid-blue"/>

  <rect x="120" y="1210" width="720" height="78" rx="18" fill="#FFFFFF" stroke="#3D7EA6" stroke-width="3"/>
  <circle cx="168" cy="1249" r="22" fill="#3D7EA6"/>
  <text x="168" y="1256" text-anchor="middle" class="num">6</text>
  <text x="208" y="1242" class="card-title">向量证据检索 + 候选人评分</text>
  <text x="208" y="1272" class="small">JD query 检索简历片段，score_candidate 生成匹配度与风险扣分</text>

  <rect x="960" y="1210" width="720" height="78" rx="18" fill="#FFFFFF" stroke="#3D7EA6" stroke-width="3"/>
  <circle cx="1008" cy="1249" r="22" fill="#3D7EA6"/>
  <text x="1008" y="1256" text-anchor="middle" class="num">7</text>
  <text x="1048" y="1242" class="card-title">面试题 / 追问 / 持久化输出</text>
  <text x="1048" y="1272" class="small">生成 10 题、3-5 个追问，输出 JSON，并写入 SQLite 运行记录</text>

  <path d="M900 1202H480V1210" class="solid-blue"/>
  <path d="M900 1202H1320V1210" class="solid-blue"/>

  <!-- Legend -->
  <rect x="1220" y="40" width="490" height="66" rx="16" fill="#FFFFFF" stroke="#C9D6DE" stroke-width="2"/>
  <path d="M1252 64H1318" class="solid-blue"/>
  <text x="1338" y="70" class="small">优先路径</text>
  <path d="M1450 64H1516" class="dash-orange"/>
  <text x="1536" y="70" class="small">失败/不可用时回退</text>
  <text x="1248" y="96" class="note">LLM 抽取必须有原文证据，规则结果仅在兜底时接管。</text>
</svg>
